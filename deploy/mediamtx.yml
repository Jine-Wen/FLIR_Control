# mediamtx config for FLIR PTZ low-latency WebRTC streaming
# Edit CAMERA_IP to match your camera IP (or pass via setup_mediamtx.sh <CAMERA_IP>)

logLevel: warn
logDestinations: [stdout]

# ── REST API (for dynamic path updates on model switch) ─────────────────────
api: yes
apiAddress: :9997

# ── RTSP server (mediamtx internal, camera → mediamtx) ──────────────────────
rtsp: yes
rtspAddress: :8554          # internal port, avoids clash with camera's :8554

# ── WebRTC ──────────────────────────────────────────────────────────────────
webrtc: yes
webrtcAddress: :8889

# ICE-TCP, offered alongside the default UDP candidates. Purely additive: a
# browser that can reach the UDP candidate still uses it, because UDP has the
# higher ICE priority.
#
# It is here as a safety net for topologies where UDP cannot get through but
# TCP can -- a browser on a different network stack from mediamtx (a Windows
# browser talking to WSL2, or a VPN that only forwards TCP). In those cases
# signalling succeeds over :8889, mediamtx advertises host candidates on its
# own internal addresses, no UDP media ever arrives, and the pane stays black.
# A TCP candidate gives the browser a route that such setups do forward.
webrtcLocalTCPAddress: :8189
webrtcLocalUDPAddress: :8189

# If the browser still cannot reach the advertised candidates (a different
# subnet, or a VPN), list the address the browser should use here, e.g.
#   webrtcAdditionalHosts: [192.168.1.20]
webrtcAdditionalHosts: []

# No STUN/TURN: this is a LAN deployment. Add servers here only if the
# dashboard is ever reached across NAT.
webrtcICEServers2: []

# ── Disable unused protocols ────────────────────────────────────────────────
hls: no
srt: no
rtmp: no

# ── Stream paths ────────────────────────────────────────────────────────────
# Default sources use 364C paths. setup_mediamtx.sh patches these for M232.
# The web node also updates these dynamically via the mediamtx REST API
# when the model is switched in the web UI.
paths:
  ir:
    source: rtsp://CAMERA_IP:8554/ir.0   # 364C default; M232 → ir
    sourceProtocol: udp
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s

  eo:
    source: rtsp://CAMERA_IP:8554/vis.0  # 364C only; not used for M232
    sourceProtocol: udp
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 30s
