# /etc/nginx/sites-available/flir-ptz
# Nginx reverse proxy with Basic Auth for FLIR PTZ web dashboard.
# Access: http://<wireguard-ip>:8443/
#
# Install:
#   sudo cp deploy/nginx-flir.conf /etc/nginx/sites-available/flir-ptz
#   sudo ln -sf /etc/nginx/sites-available/flir-ptz /etc/nginx/sites-enabled/flir-ptz
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8443;          # external port (WireGuard side)
    server_name _;

    # ── Basic Auth ──────────────────────────────────────────────────────────
    auth_basic           "FLIR PTZ Control";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # ── Server-Sent Events telemetry stream ─────────────────────────────────
    # MUST come before the generic `location /` block.
    #
    # The dashboard receives all telemetry over one long-lived SSE connection
    # (this replaced the old 250 ms polling loop). nginx buffers proxied
    # responses by default, which holds SSE frames back until the buffer fills
    # — the browser would receive telemetry in delayed bursts, or nothing at
    # all. Buffering must be off and the read timeout must exceed the stream
    # lifetime, since an SSE connection is intentionally never-ending.
    location /api/events {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;

        # The stream sends a `: keepalive` comment every 15 s, so anything
        # comfortably above that is safe. 1 h avoids needless reconnects.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── MJPEG fallback stream (used when WebRTC is unavailable) ─────────────
    # Also long-lived and also must not be buffered.
    location /api/stream/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_buffering    off;
        proxy_cache        off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Everything else: pages, static assets, command endpoints ────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ── Note on WebRTC ──────────────────────────────────────────────────────────
# Video does NOT flow through this proxy. The browser connects directly to
# mediamtx on port 8889 (WHEP). If the dashboard is reached over WireGuard,
# port 8889 must also be reachable, or the UI will fall back to the MJPEG
# stream above — which does go through this proxy and is therefore always
# available, at the cost of higher latency.
