<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBT SWARM · Connect Camera</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="setup-body">
  <div class="setup-card">
    <div class="setup-logo">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <path class="mark-top" d="M50 13 H29 L15 24 L30 35"
              fill="none" stroke-width="8.5" stroke-linejoin="miter"
              style="stroke:#1B2838"/>
        <path class="mark-bot" d="M14 51 H35 L49 40 L34 29"
              fill="none" stroke-width="8.5" stroke-linejoin="miter"
              style="stroke:#1560D0"/>
      </svg>
      <div class="wordmark">CBT <em>SWARM</em></div>
      <p class="sub">Enter camera credentials to connect</p>
    </div>

    <form id="connect-form" autocomplete="on">

      <div class="field">
        <label for="host">Camera IP Address</label>
        <input type="text" id="host" name="host" placeholder="192.168.1.50"
               autocomplete="url" spellcheck="false">
      </div>

      <div class="field">
        <label for="model">Camera Model</label>
        <select id="model" name="model">
          <option value="364c">FLIR 364C — port 8554, ir.0 / vis.0</option>
          <option value="m232">FLIR M232 — port 8554, ir</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" value="admin"
                 autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="connect-btn">
        <div class="spinner"></div>
        <span class="btn-text">Connect</span>
      </button>

      <div id="status-box" class="status-box"></div>
    </form>
  </div>

  <script src="/setup.js"></script>
</body>
</html>
