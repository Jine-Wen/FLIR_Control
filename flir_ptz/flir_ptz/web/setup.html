<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FLIR PTZ — Connect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e6edf3;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 1px;
    }
    .logo p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 4px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
    }
    input:focus, select:focus {
      border-color: #58a6ff;
    }
    select option { background: #161b22; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .row .field { margin-bottom: 0; }
    .row input, .row select { margin-bottom: 0; }
    .field { margin-bottom: 18px; }

    button {
      width: 100%;
      padding: 12px;
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover:not(:disabled) { background: #388bfd; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    button.loading .spinner { display: block; }
    button.loading .btn-text::after { content: "ing…"; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .status-box {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 0.88rem;
      display: none;
    }
    .status-box.error   { background: rgba(248,81,73,0.12); border: 1px solid #f8514966; color: #ff7b72; }
    .status-box.success { background: rgba(63,185,80,0.12); border: 1px solid #3fb95066; color: #56d364; }
    .status-box.info    { background: rgba(88,166,255,0.08); border: 1px solid #58a6ff66; color: #58a6ff; }
    .status-box.show    { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>FLIR PTZ</h1>
      <p>Enter camera credentials to connect</p>
    </div>

    <form id="connect-form" autocomplete="on">

      <div class="field">
        <label for="host">Camera IP Address</label>
        <input type="text" id="host" name="host" placeholder="192.168.1.50"
               autocomplete="url" spellcheck="false">
      </div>

      <div class="field">
        <label for="model">Camera Model</label>
        <select id="model" name="model">
          <option value="364c">FLIR 364C (port 8554, ir.0 / vis.0)</option>
          <option value="m232">FLIR M232 (port 8554, ir)</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" value="admin"
                 autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="connect-btn">
        <div class="spinner"></div>
        <span class="btn-text">Connect</span>
      </button>

      <div id="status-box" class="status-box"></div>
    </form>
  </div>

  <script src="setup.js"></script>
</body>
</html>
